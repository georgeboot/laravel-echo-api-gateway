name: Publish new release

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (e.g. 0.5.8)
        required: true

permissions:
  id-token: write # npm trusted publishing (OIDC)
  contents: write # push the version bump

jobs:
  release:
    name: Create NPM release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm ci --verbose
      - run: git config --global user.name "GitHub CD bot"
      - run: git config --global user.email "github-cd-bot@github.com"
      - run: npm --no-git-tag-version version "$VERSION"
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
      #      - run: npm run build
      #      - run: npm run test
      - run: npm publish --verbose --access public --tag latest
      - run: git add package.json package-lock.json
      - run: git commit -m 'Bump version'
      - run: git push
