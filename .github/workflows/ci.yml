name: CI

on:
  - pull_request
  - push

jobs:
  pest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            laravel: '^10.0'
            testbench: '^8.0'
          - php: '8.2'
            laravel: '^11.0'
            testbench: '^9.0'
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.5'
            laravel: '^13.0'
            testbench: '^11.0'
    name: Pest - PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, soap, bcmath, pdo_sqlite, intl
          coverage: pcov
      - name: Install dependencies
        run: |
          composer update --no-interaction --prefer-dist --with-all-dependencies \
            --with "laravel/framework:${{ matrix.laravel }}" \
            --with "orchestra/testbench:${{ matrix.testbench }}"
      - name: Run PestPHP
        run: vendor/bin/pest --coverage-clover test-results/pest.xml
        env:
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
          AWS_SESSION_TOKEN: fake
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: pest-${{ matrix.php }}
          files: test-results/pest.xml

  larastan:
    runs-on: ubuntu-latest
    name: Larastan
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: soap, bcmath, pdo_sqlite, intl
      - uses: ramsey/composer-install@v3
      - name: Run Larastan
        run: vendor/bin/phpstan analyse --no-progress

  eslint:
    runs-on: ubuntu-latest
    name: ESLint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  jest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    # The suite runs every test against laravel-echo v1 (aliased as laravel-echo-v1) and v2.
    name: Jest - Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run Jest
        run: npm test -- --coverage --coverageDirectory=test-results/jest
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: jest
          files: test-results/jest/clover.xml
